[project]
name = "game-catalog"
version = "0.1.0"
description = "Definitive PlayStation game catalog (owned_games store) from PSN + retailer receipts via msgvault, enriched with IGDB. The catalog pshelf reads."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dagster",
    "dagster-webserver",
    "httpx",
    "fastapi",
    "uvicorn",  # manual-edit API (catalog write path),
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "fastmcp>=4.1.4",  # catalog_mcp server tests (separate container at deploy)
]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

# NOTE: the distribution name is `game-catalog` but the importable package is
# still `mailroom` (src/mailroom/). Renaming the Python package is deliberately
# out of scope: it is the Dagster module path (-m mailroom.definitions) and
# appears in every import, so it needs its own revertable commit.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
